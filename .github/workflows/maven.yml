name: Java CI

on:
  push:
    branches:
      - 'master'
  pull_request: {}

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      max-parallel: 20
      matrix:
        java: [ 8, 11, 17, 21, 25, 27 ]
        experimental: [false]
        include:
          - java: 28-ea
            experimental: true
        
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Build with Maven
      run: mvn --errors --show-version --batch-mode --no-transfer-progress

  database-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [8, 25]
        database: [postgresql, mysql, mariadb, oracle, sqlserver]
    env:
      DBCP_TEST_RUN: dbcp-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.java }}-${{ matrix.database }}
      DBCP_TEST_DATABASE: ${{ matrix.database }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: maven
    - name: Test ${{ matrix.database }}
      run: mvn -B -ntp -Pdocker-it -Ddbcp.docker.runId="$DBCP_TEST_RUN" -Ddbcp.test.databases="$DBCP_TEST_DATABASE" verify
    - name: Collect remaining database logs and clean up
      if: always()
      shell: bash
      run: |
        while read -r container; do
          [ -n "$container" ] || continue
          docker logs "$container" || true
          docker rm --force --volumes "$container"
        done < <(docker ps --all --quiet --filter "label=org.apache.commons.dbcp.testRun=$DBCP_TEST_RUN")
